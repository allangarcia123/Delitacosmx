<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>DELITACOSMX</title>
<style>
:root{--ch:#b3141b;--ce:#ffb400;--co:#1c1917;--vd:#1f8f4e;--bg:#fbfaf8;--ln:#e7e2db}
*{box-sizing:border-box}
body{margin:0;font:18px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--co);padding-bottom:96px}
header{background:var(--co);color:#fff;padding:16px 16px 12px;text-align:center;border-bottom:6px solid var(--ce)}
h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.5px;color:var(--ce)}
header small{font-size:16px;font-weight:700}
#st{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:20px;font-weight:700;font-size:15px}
.on{background:var(--vd)}.off{background:#57534e}
nav{display:flex;position:sticky;top:0;background:#fff;border-bottom:2px solid var(--ln);z-index:5}
nav button{flex:1;padding:15px 4px;border:0;background:none;font-size:17px;font-weight:800;color:#78716c}
nav .a{color:var(--ch);box-shadow:inset 0 -5px 0 var(--ch)}
.wrap{max-width:580px;margin:auto;padding:10px 12px}
h3{margin:2px 0 6px;font-size:20px}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.q{display:flex;align-items:center;gap:12px}
.q button{width:42px;height:42px;border-radius:8px;border:0;background:var(--ch);color:#fff;font-size:24px;font-weight:800}
.q b{min-width:18px;text-align:center}
.btn{display:block;width:100%;background:var(--ch);color:#fff;border:0;border-radius:10px;padding:14px;font-size:18px;font-weight:800;margin:8px 0;text-align:center;text-decoration:none}
.btn.g{background:var(--vd)}
.btn.s{background:#fff;color:var(--ch);border:2px solid var(--ch)}
.btn.i{display:inline-block;width:auto;padding:8px 12px;font-size:16px;margin:4px 4px 4px 0}
input,textarea,select{width:100%;padding:13px;border:2px solid var(--ln);border-radius:10px;font-size:18px;margin:5px 0;background:#fff;color:var(--co);font-family:inherit}
#bar{position:fixed;left:10px;right:10px;bottom:10px;background:var(--vd);color:#fff;border-radius:12px;padding:16px;font-weight:800;font-size:19px;text-align:center;box-shadow:0 6px 18px #0005;display:none;z-index:9}
.post img{width:100%;border-radius:8px;margin:6px 0}
.sm{font-size:15px;color:#6b645d;margin:4px 0}
.hide{display:none}
.tot{font-weight:800;font-size:20px}
.prog{height:18px;background:var(--ln);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--vd)}
pre{white-space:pre-wrap;font:inherit;font-size:15px;margin:4px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ce);outline-offset:2px}
</style></head>
<body>
<header><h1>DELITACOSMX</h1><small>SIMPLEMENTE TACOS.</small><br><span id="st"></span></header>
<nav><button id="t1" class="a">🌮 Pedir</button><button id="t3">⭐ Cliente</button><button id="t2">📸 Comunidad</button></nav>
<main class="wrap">
<section id="v1">
 <button class="btn s" id="rep" type="button">🔁 Repetir mi pedido anterior</button>
 <div id="menu"></div>
 <div class="card"><h3>Las 4 salsas de la casa 🥣</h3><p>🟢 Verde · 🔴 Roja · 🔥 Tatemada · 🍍 Piña habanero</p><p class="sm">Van con tu pedido, en cazuelitas. Las salsas adicionales se cobran.</p></div>
 <div class="card hide" id="rev">
  <h3>Revisa tu pedido</h3>
  <div id="lines"></div>
  <input id="nom" placeholder="Tu nombre" autocomplete="name">
  <select id="tipo"><option value="d">🛵 A domicilio (solo Campo Nubes, $10)</option><option value="r">🏃 Iré por mi pedido</option></select>
  <div id="dom"><input id="dir" placeholder="Calle y número en Campo Nubes"><input id="ref" placeholder="Referencias (color de casa, portón...)"><button class="btn s" id="loc" type="button">📍 Agregar mi ubicación</button></div>
  <select id="pay"><option>Efectivo</option><option>Transferencia</option></select>
  <textarea id="nota" rows="2" placeholder="Notas (sin cebolla, más limón...)"></textarea>
  <select id="num"><option value="524438400207">WhatsApp 443 840 0207</option><option value="524431156679">WhatsApp 443 115 6679</option></select>
  <p class="sm" id="nlog"></p>
  <button class="btn g" id="send" type="button">Enviar por WhatsApp</button>
 </div>
 <div class="card">
  <h3>¿Ya hiciste tu pedido?</h3>
  <button class="btn s i" data-w="Hola, quiero agregar algo a mi pedido.">Agregar algo</button>
  <button class="btn s i" data-w="Hola, quiero cambiar mi dirección.">Cambiar dirección</button>
  <button class="btn s i" data-w="Hola, ¿ya salió mi pedido?">¿Ya salió mi pedido?</button>
 </div>
</section>
<section id="v3" class="hide"></section>
<section id="v2" class="hide"></section>
</main>
<div id="bar"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,getDoc,query,where,updateDoc,deleteDoc,doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyC1q_idpZe5C0gJhSECKJwr77wmTALFIEk",authDomain:"delitacosmx-dd78a.firebaseapp.com",projectId:"delitacosmx-dd78a",storageBucket:"delitacosmx-dd78a.firebasestorage.app",messagingSenderId:"173267887649",appId:"1:173267887649:web:da5f5ab737da8fd448e560"});
const auth=getAuth(app),db=getFirestore(app);
const ADMIN="allangarcia1992.1@gmail.com";
const PROMOS=[]; // Escribe aquí tus promociones, ejemplo: ["Hoy: tacos $18 c/u"]
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Estado abierto/cerrado ---------- */
const d0=new Date(),h0=d0.getHours()+d0.getMinutes()/60;
const abierto=d0.getDay()!==4&&h0>=20.5&&h0<23;
$("st").className=abierto?"on":"off";
$("st").textContent=abierto?"🟢 Abierto ahora · hasta las 11 pm":(d0.getDay()===4?"Hoy descansamos · abrimos mañana 8:30 pm":"Cerrado · abrimos 8:30 pm");

/* ---------- Menú y carrito ---------- */
const F=["bistec","tripa","chorizo","adobada"];
const M=[
 ["🌮 Tacos · $18 c/u",F.map(f=>["Taco de "+f,18])],
 ["🧀 Quesadillas de maíz (tortilla de maíz tradicional) · $45",F.map(f=>["Quesadilla de maíz de "+f,45])],
 ["🧀 Quesadillas de harina · $40",F.map(f=>["Quesadilla de harina de "+f,40])],
 ["🌶️ Salsas extra",[["Salsa verde extra",10],["Salsa roja extra",10],["Salsa tatemada extra",10],["Salsa piña habanero extra",12]]]
];
const C={};
$("menu").innerHTML=M.map((g,i)=>`<div class="card"><h3>${g[0]}</h3>${g[1].map((p,j)=>`<div class="row"><span>${p[0].replace(/^(Taco|Quesadilla) de /,"").replace(/^(maíz|harina) de /,"")} <b>$${p[1]}</b></span><span class="q"><button data-m="-1" data-i="${i}" data-j="${j}" aria-label="Quitar">−</button><b id="n${i}_${j}">0</b><button data-m="1" data-i="${i}" data-j="${j}" aria-label="Agregar">+</button></span></div>`).join("")}</div>`).join("");

const lineas=()=>Object.entries(C).filter(e=>e[1]>0).map(([k,n])=>{const [i,j]=k.split("_"),p=M[i][1][j];return{n,name:p[0],t:n*p[1]}});
const envio=()=>$("tipo").value==="d"?10:0;
function barra(){
 const L=lineas(),n=L.reduce((a,l)=>a+l.n,0),t=L.reduce((a,l)=>a+l.t,0);
 const b=$("bar");
 b.style.display=n?"block":"none";
 b.textContent=`🛒 ${n} ${n===1?"producto":"productos"} · $${t} — Ver mi pedido`;
 if(!$("rev").classList.contains("hide"))rev();
}
function rev(){
 const L=lineas(),sub=L.reduce((a,l)=>a+l.t,0),e=envio();
 $("lines").innerHTML=L.map(l=>`<div class="row"><span>${l.n} × ${esc(l.name)}</span><b>$${l.t}</b></div>`).join("")+
  (e?`<div class="row"><span>Envío a domicilio</span><b>$${e}</b></div>`:"")+
  `<div class="row tot"><span>Total</span><span>$${sub+e}</span></div>`;
 $("dom").classList.toggle("hide",$("tipo").value!=="d");
}
let loc="";
try{$("nom").value=localStorage.getItem("dtx_nom")||"";$("dir").value=localStorage.getItem("dtx_dir")||"";$("ref").value=localStorage.getItem("dtx_ref")||""}catch(e){}

function wa(txt){window.open("https://wa.me/"+$("num").value+"?text="+encodeURIComponent(txt),"_blank")}
function enviar(){
 const L=lineas(),nom=$("nom").value.trim(),dir=$("dir").value.trim(),ref=$("ref").value.trim(),dom=$("tipo").value==="d";
 if(!L.length)return alert("Agrega al menos un producto.");
 if(!nom)return alert("Escribe tu nombre.");
 if(dom&&!dir&&!loc)return alert("Escribe tu dirección en Campo Nubes o agrega tu ubicación.");
 try{localStorage.setItem("dtx_nom",nom);localStorage.setItem("dtx_dir",dir);localStorage.setItem("dtx_ref",ref);localStorage.setItem("dtx_last",JSON.stringify(C))}catch(e){}
 const sub=L.reduce((a,l)=>a+l.t,0),e=envio();
 let m="Hola DELITACOSMX 🌮 Quiero hacer un pedido:\n"+L.map(l=>`• ${l.n} × ${l.name} — $${l.t}`).join("\n")+
  `\n\nSubtotal: $${sub}\n`+(dom?`Envío: $${e}\n`:"")+`Total: $${sub+e}\n\nNombre: ${nom}\nEntrega: ${dom?"A domicilio":"Paso por mi pedido"}\n`+
  (dom?`Dirección: ${dir||"(ver ubicación)"}\n`:"")+(dom&&ref?`Referencias: ${ref}\n`:"")+(loc&&dom?`Ubicación: ${loc}\n`:"")+`Pago: ${$("pay").value}`+
  ($("nota").value.trim()?`\nNotas: ${$("nota").value.trim()}`:"");
 if(U)addDoc(collection(db,"orders"),{userId:U.uid,userName:U.displayName||"",text:m.slice(0,1900),total:sub+e,status:"pending",createdAt:serverTimestamp()}).catch(err=>console.error(err));
 wa(m);
}
function repetir(){
 try{
  const d=JSON.parse(localStorage.getItem("dtx_last"));
  if(!d||!Object.values(d).some(v=>v>0))throw 0;
  Object.keys(C).forEach(k=>{C[k]=0;$("n"+k).textContent=0});
  Object.entries(d).forEach(([k,v])=>{if($("n"+k)){C[k]=v;$("n"+k).textContent=v}});
  $("rev").classList.remove("hide");barra();rev();$("rev").scrollIntoView({behavior:"smooth"});
 }catch(x){alert("Todavía no tienes un pedido anterior en este teléfono.")}
}
function compartir(t){
 const u=location.origin+location.pathname;
 if(navigator.share)navigator.share({title:"DELITACOSMX",text:t,url:u}).catch(()=>{});
 else navigator.clipboard.writeText(t+" "+u).then(()=>alert("Enlace copiado. Pégalo en WhatsApp."));
}

document.addEventListener("click",async e=>{
 const w=e.target.closest("[data-w]");if(w)return wa(w.dataset.w);
 const m=e.target.closest("[data-m]");
 if(m){const k=m.dataset.i+"_"+m.dataset.j;C[k]=Math.max(0,(C[k]||0)+ +m.dataset.m);$("n"+k).textContent=C[k];return barra()}
 if(e.target.closest("#bar")){$("rev").classList.remove("hide");rev();return $("rev").scrollIntoView({behavior:"smooth"})}
 if(e.target.id==="send")return enviar();
 if(e.target.id==="rep")return repetir();
 if(e.target.id==="loc"){
  if(!navigator.geolocation)return alert("Tu celular no permite compartir ubicación.");
  navigator.geolocation.getCurrentPosition(p=>{loc=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;e.target.textContent="✅ Ubicación agregada"},()=>alert("No pudimos obtener tu ubicación. Escribe tu dirección."));return;
 }
 const b=e.target.closest("[data-a]");if(!b)return;
 e.preventDefault();
 const a=b.dataset.a,id=b.dataset.id;
 try{
  if(a==="in")await signInWithPopup(auth,new GoogleAuthProvider());
  else if(a==="out")await signOut(auth);
  else if(a==="pub")await publicar();
  else if(a==="ord"){tab(1);window.scrollTo(0,0)}
  else if(a==="sh")compartir(b.dataset.t);
  else if(a==="rd")wa("Hola, completé 10 pedidos en DELITACOSMX y quiero canjear mis 4 salsas gratis (verde, roja, tatemada y piña habanero). Nombre: "+(U?.displayName||""));
  else if(a==="oc"){await updateDoc(doc(db,"orders",id),{status:"confirmed"});cli()}
  else if(a==="ox"){await updateDoc(doc(db,"orders",id),{status:"cancelled"});cli()}
  else if(a==="rw"){await setDoc(doc(db,"rewards",b.dataset.u),{delivered:+b.dataset.d+1,userName:b.dataset.n});cli()}
  else if(a==="ok"){await updateDoc(doc(db,"posts",id),{status:"approved"});com()}
  else if(a==="no"){await updateDoc(doc(db,"posts",id),{status:"rejected"});com()}
  else if(a==="del"){if(confirm("¿Borrar esta publicación?")){await deleteDoc(doc(db,"posts",id));com()}}
  else if(a==="like"){
   if(!U)return alert("Entra con Google para dar Me gusta.");
   const r=doc(db,"posts",id,"likes",U.uid);
   if(LK[id]?.has(U.uid)){await deleteDoc(r);LK[id].delete(U.uid)}else{await setDoc(r,{t:serverTimestamp()});(LK[id]=LK[id]||new Set()).add(U.uid)}
   $("l"+id).textContent=LK[id].size;
  }
  else if(a==="cm")await coments(id);
  else if(a==="ac"){const t=$("ci"+id).value.trim();if(!t)return;await addDoc(collection(db,"posts",id,"comments"),{authorId:U.uid,authorName:U.displayName||"Cliente",text:t,createdAt:serverTimestamp()});await coments(id)}
  else if(a==="dc"){await deleteDoc(doc(db,"posts",id,"comments",b.dataset.c));await coments(id)}
  else if(a==="cp"){const mins=$("min").value.trim();const tx={r:`¡Pedido recibido! 🌮 Estará listo en aproximadamente ${mins||"__"} minutos.`,s:"¡Ya salió tu pedido! 🛵",l:"¡Ya llegué! 📍 Estoy afuera con tu pedido."}[b.dataset.k];await navigator.clipboard.writeText(tx);b.textContent="✅ Copiado"}
 }catch(err){console.error(err);if(err.code!=="auth/popup-closed-by-user")alert("Algo falló. Revisa tu conexión e intenta de nuevo.")}
});
["tipo"].forEach(i=>$(i).addEventListener("change",rev));

/* ---------- Pestañas ---------- */
function tab(n){
 $("v1").classList.toggle("hide",n!==1);$("v2").classList.toggle("hide",n!==2);$("v3").classList.toggle("hide",n!==3);
 $("t1").className=n===1?"a":"";$("t2").className=n===2?"a":"";$("t3").className=n===3?"a":"";
 if(n===2)com();if(n===3)cli();
}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);$("t3").onclick=()=>tab(3);

/* ---------- Sesión ---------- */
let U=null;const LK={};
const isA=()=>U&&U.email===ADMIN;
onAuthStateChanged(auth,u=>{
 U=u;
 $("nlog").textContent=u?"Este pedido se registrará en tu cuenta Cliente Delitacosmx.":"Entra con Google en la pestaña Cliente para que este pedido cuente en tu programa.";
 if(!$("v2").classList.contains("hide"))com();
 if(!$("v3").classList.contains("hide"))cli();
});

/* ---------- Cliente Delitacosmx (fidelidad) ---------- */
async function cli(){
 const V=$("v3");
 if(!U){V.innerHTML=`<div class="card"><h3>Cliente Delitacosmx ⭐</h3><p>Entra con Google para registrar tus pedidos. Al completar <b>10 pedidos confirmados</b> ganas 4 salsas gratis: una verde, una roja, una tatemada y una piña habanero.</p><button class="btn" data-a="in">Entrar con Google</button></div>`;return}
 V.innerHTML='<p class="sm">Cargando...</p>';
 try{
  const o=(await getDocs(query(collection(db,"orders"),where("userId","==",U.uid)))).docs.map(d=>d.data());
  const c=o.filter(x=>x.status==="confirmed").length,p=o.filter(x=>x.status==="pending").length;
  const r=await getDoc(doc(db,"rewards",U.uid)),dl=r.exists()?(r.data().delivered||0):0;
  const av=Math.floor(c/10)-dl,pr=c%10;
  let h=`<div class="card row"><span>👋 ${esc(U.displayName||U.email)}</span><button class="btn s i" data-a="out">Salir</button></div>
  <div class="card"><h3>Cliente Delitacosmx ⭐</h3>
  <p>Cada 10 pedidos confirmados ganas 4 salsas gratis: verde, roja, tatemada y piña habanero.</p>
  <div class="prog"><i style="width:${av>0?100:pr*10}%"></i></div>
  <p class="tot">${av>0?"¡Felicidades! Completaste 10 pedidos 🎉":`Llevas ${pr} de 10 pedidos`}</p>
  ${av>0?'<button class="btn g" data-a="rd">🎁 Canjear mis 4 salsas</button>':""}
  <p class="sm">Pedidos esperando confirmación del negocio: ${p}. Solo cuentan los pedidos confirmados; los cancelados no.</p></div>`;
  if(isA()){
   h+="<h3>Panel del negocio</h3>";
   const os=(await getDocs(query(collection(db,"orders"),where("status","==","pending")))).docs;
   h+=`<p class="sm">Pedidos por confirmar (${os.length})</p>`+os.map(d=>{const x=d.data();return `<div class="card"><b>${esc(x.userName)} · $${esc(x.total)}</b><pre>${esc(x.text)}</pre><button class="btn g i" data-a="oc" data-id="${d.id}">✅ Confirmar</button><button class="btn s i" data-a="ox" data-id="${d.id}">Cancelar</button></div>`}).join("");
   const cs=(await getDocs(query(collection(db,"orders"),where("status","==","confirmed")))).docs,g={};
   cs.forEach(d=>{const x=d.data();g[x.userId]=g[x.userId]||{n:x.userName,c:0};g[x.userId].c++});
   let rw="";
   for(const [u,v] of Object.entries(g)){const rr=await getDoc(doc(db,"rewards",u)),d2=rr.exists()?(rr.data().delivered||0):0;if(Math.floor(v.c/10)-d2>0)rw+=`<div class="card row"><span>${esc(v.n)} · ${v.c} pedidos</span><button class="btn g i" data-a="rw" data-u="${esc(u)}" data-d="${d2}" data-n="${esc(v.n)}">Marcar entregada</button></div>`}
   h+=`<p class="sm">Recompensas por entregar</p>`+(rw||'<p class="sm">Nadie tiene recompensa pendiente.</p>');
  }
  V.innerHTML=h;
 }catch(err){console.error(err);V.innerHTML='<div class="card"><p>No pudimos cargar tu avance. ¿Ya publicaste la regla de pedidos en Firebase? Intenta de nuevo.</p></div>'}
}

/* ---------- Comunidad ---------- */
const reducir=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.src=URL.createObjectURL(f)});

async function publicar(){
 const f=$("ph").files[0],t=$("tx").value.trim();
 if(!f||!t)return alert("Agrega una foto y tu recomendación.");
 const photo=await reducir(f);
 if(photo.length>690000)return alert("La foto pesa mucho. Prueba con otra.");
 await addDoc(collection(db,"posts"),{authorId:U.uid,authorName:U.displayName||"Cliente",text:t,photo,status:"pending",createdAt:serverTimestamp()});
 alert("¡Gracias! Tu publicación está en revisión y aparecerá cuando la aprobemos.");
 com();
}

function tarjeta(p,pend){
 const x=p.data(),id=p.id,btn=(a,t,c="")=>`<button class="btn s i ${c}" data-a="${a}" data-id="${id}">${t}</button>`;
 return `<div class="card post"><b>${esc(x.authorName)}</b>${pend?' <span class="sm">· en revisión</span>':""}<p>${esc(x.text)}</p>`+
 (typeof x.photo==="string"&&x.photo.startsWith("data:image/")?`<img src="${x.photo}" alt="Foto de ${esc(x.authorName)}">`:"")+
 (pend?`${btn("ok","✅ Aprobar")}${btn("no","Rechazar")}${btn("del","🗑 Borrar")}`
  :`${btn("like",'❤️ <span id="l'+id+'">0</span>')}${btn("cm","💬 Comentarios")}${btn("ord","🌮 Pedir")}${isA()?btn("del","🗑 Borrar"):""}`)+
 `<div id="c${id}"></div></div>`;
}

async function coments(id){
 const s=await getDocs(collection(db,"posts",id,"comments"));
 $("c"+id).innerHTML=s.docs.map(x=>{const c=x.data();return `<div class="sm"><b>${esc(c.authorName)}:</b> ${esc(c.text)}${(isA()||(U&&c.authorId===U.uid))?` <a href="#" data-a="dc" data-id="${id}" data-c="${x.id}">🗑</a>`:""}</div>`}).join("")+
 (U?`<input id="ci${id}" placeholder="Escribe un comentario" maxlength="300"><button class="btn s i" data-a="ac" data-id="${id}">Comentar</button>`:'<p class="sm">Entra con Google para comentar.</p>');
}

async function com(){
 const V=$("v2");
 let h=`<div class="card"><h3>Comunidad Delitacosmx</h3><button class="btn" data-a="sh" data-t="Prueba los tacos de DELITACOSMX en Campo Nubes.">🔗 Invitar a alguien</button><button class="btn s" data-a="sh" data-t="Te recomiendo DELITACOSMX.">❤️ Recomendar Delitacosmx</button><a class="btn g" href="https://wa.me/524431156679" target="_blank" rel="noopener">💬 Abrir WhatsApp</a></div>`+
